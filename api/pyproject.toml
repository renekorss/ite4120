[project]
name = "driving-licence-reminder-api"
version = "0.1.0"
description = "Frontend API for Driving Licence Reminder"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "pwdlib[argon2]>=0.3,<1",
  "pywebpush>=2.5.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11", "pip-audit>=2.9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: PostgreSQL and HTTP integration tests"]

[tool.coverage.run]
source = ["licence_api"]

[tool.ruff.lint.per-file-ignores]
# FastAPI deliberately uses Depends/Query objects as declarative defaults.
"**/licence_api/main.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["licence_api", "conftest"]
