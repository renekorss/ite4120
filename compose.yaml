services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licence_reminder}
      POSTGRES_USER: ${POSTGRES_USER:-database_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=et-EE
      TZ: UTC
      PGTZ: UTC
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/bootstrap.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./database/tests:/tests:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
    command: [postgres, -c, timezone=UTC, -c, log_destination=stderr, -c, logging_collector=on, -c, log_destination=jsonlog, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
  liquibase:
    image: ${LIQUIBASE_IMAGE:-liquibase/liquibase:4.33.0@sha256:e116c935ba22b59a22165207f65c268e363269de30bb1fedacff3755c2abaa8c}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-licence_reminder}
      LIQUIBASE_COMMAND_USERNAME: migrator
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog.xml
      LIQUIBASE_ANALYTICS_ENABLED: 'false'
    entrypoint: [/bin/sh, /workspace/database/migrate.sh]
    command: [update]
    secrets:
      - postgres_password
    volumes:
      - ./database:/workspace/database:ro
    working_dir: /workspace/database
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./.secrets/postgres_password}
volumes:
  postgres_data:
